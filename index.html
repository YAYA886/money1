<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>安全單機記帳本</title>
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 20px; background-color: #f5f5f7; color: #1d1d1f; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; }
        button { background-color: #0071e3; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn-backup { background-color: #34c759; margin-top: 15px; }
        .btn-import { background-color: #8e8e93; }
        .record-list { margin-top: 20px; max-height: 250px; overflow-y: auto; border-top: 1px solid #eee; padding-top: 10px; }
        .record-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #f5f5f7; }
        .file-input { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>安全單機記帳本 (資料庫測試)</h2>
        <input type="number" id="amount" placeholder="輸入金額" pattern="[0-9]*" inputmode="numeric">
        <select id="category">
            <option value="餐飲">餐飲</option>
            <option value="交通">交通</option>
            <option value="娛樂">娛樂</option>
            <option value="生活">生活</option>
        </select>
        <button onclick="addRecord()">測試：新增紀錄</button>

        <div class="record-list" id="recordList"></div>

        <!-- 備份安全防線 -->
        <button class="btn-backup" onclick="exportToCSV()">測試：匯出 CSV 備份</button>
        <button class="btn-import" onclick="document.getElementById('importFile').click()">測試：匯入備份</button>
        <input type="file" id="importFile" class="file-input" accept=".csv" onchange="importFromCSV(this)">
    </div>

    <script>
        let db;
        // 1. 初始化 IndexedDB 安全資料庫
        const request = indexedDB.open("MoneyDB", 1);
        
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            db.createObjectStore("records", { keyPath: "id", autoIncrement: true });
        };

        request.onsuccess = (e) => {
            db = e.target.result;
            loadRecords(); // 成功開啟後立刻讀取舊資料
        };

        request.onerror = (e) => {
            alert("資料庫初始化失敗，請確保在標準瀏覽器中開啟。");
        };

        // 2. 讀取資料庫
        function loadRecords() {
            const transaction = db.transaction(["records"], "readonly");
            const store = transaction.objectStore("records");
            const getAll = store.getAll();
            
            getAll.onsuccess = () => {
                const list = document.getElementById('recordList');
                list.innerHTML = '';
                const records = getAll.result.reverse(); // 最新記的排最上面
                records.forEach(r => {
                    list.innerHTML += `<div class="record-item"><span>${r.date} - ${r.category}</span><strong>$${r.amount}</strong></div>`;
                });
            };
        }

        // 3. 寫入資料庫
        function addRecord() {
            const amount = document.getElementById('amount').value;
            const category = document.getElementById('category').value;
            if(!amount) return alert('請輸入金額');

            const transaction = db.transaction(["records"], "readwrite");
            const store = transaction.objectStore("records");
            store.add({ amount: amount, category: category, date: new Date().toLocaleDateString() });

            transaction.oncomplete = () => {
                document.getElementById('amount').value = '';
                loadRecords(); // 重新整理清單
            };
        }

        // 4. 安全匯出 CSV 檔
        function exportToCSV() {
            const transaction = db.transaction(["records"], "readonly");
            const store = transaction.objectStore("records");
            store.getAll().onsuccess = (e) => {
                const records = e.target.result;
                if(records.length === 0) return alert('目前沒有任何資料可以備份喔！');
                
                let csvContent = "\uFEFF日期,分類,金額\n"; // 加上 BOM 防止 Excel 開啟時變亂碼
                records.forEach(r => {
                    csvContent += `${r.date},${r.category},${r.amount}\n`;
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `我的記帳備份_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };
        }

        // 5. 匯入 CSV 檔還原
        function importFromCSV(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                const text = e.target.result;
                const lines = text.split('\n');
                const transaction = db.transaction(["records"], "readwrite");
                const store = transaction.objectStore("records");

                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;
                    const cols = line.split(',');
                    if (cols.length >= 3) {
                        store.add({ date: cols[0], category: cols[1], amount: cols[2] });
                    }
                }
                transaction.oncomplete = () => {
                    alert('備份還原成功！');
                    loadRecords();
                    input.value = ''; // 清空檔案選擇器
                };
            };
            reader.readAsText(file);
        }

        // 註冊 PWA 離線快取
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
    </script>
</body>
</html>
