<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記帳本</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 頂端導覽列 -->
    <header class="app-header">
        <h1>記帳本</h1>
        <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
    </header>

    <!-- 側邊選單遮罩背景 -->
    <div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>

    <!-- 側邊選單 -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>選單功能</h3>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>
        <div class="sidebar-menu">
            <button class="menu-item" onclick="exportCSV(); toggleSidebar();">
                📤 匯出 CSV 備份
            </button>
            <button class="menu-item" onclick="importCSV(); toggleSidebar();">
                📥 匯入備份檔案
            </button>
            
            <hr class="divider-dashed" style="margin: 8px 0;">

            <div class="menu-setting-group">
                <label>🖼️ 設定背景圖片</label>
                <input type="file" id="bgImageInput" accept="image/*" onchange="handleBgImageUpload(event)">
                <button class="menu-item-sub" onclick="resetBgImage()">重置背景圖片</button>
            </div>

            <div class="menu-setting-group">
                <label>🎨 調整面板顏色與透明度</label>
                <div style="display: flex; gap: 8px; align-items: center; margin-top: 4px;">
                    <input type="color" id="cardColorPicker" value="#ffffff" onchange="handleCardColorChange()" style="width: 40px; height: 36px; border: none; cursor: pointer; background: none;">
                    <input type="range" id="cardOpacityRange" min="0.2" max="1" step="0.05" value="0.92" oninput="handleCardColorChange()" style="flex: 1;">
                </div>
                <button class="menu-item-sub" onclick="resetCardColor()">重置面板顏色</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 收入/支出切換與輸入區域 -->
        <div class="card">
            <div class="type-switch">
                <button id="typeExpenseBtn" class="type-btn active expense" onclick="switchRecordType('支出')">支出</button>
                <button id="typeIncomeBtn" class="type-btn income" onclick="switchRecordType('收入')">收入</button>
            </div>

            <div class="form-group">
                <label>日期</label>
                <input type="date" id="dateInput">
            </div>

            <div class="form-group">
                <label>選擇分類</label>
                <button id="cateTrigger" class="cate-trigger" onclick="openModal()">飲食 > 早餐</button>
            </div>

            <div class="form-group">
                <label>金額</label>
                <input type="number" id="amountInput" placeholder="請輸入金額" pattern="\d*">
            </div>

            <div class="form-group">
                <label>備註</label>
                <input type="text" id="noteInput" placeholder="填寫備註 (選填)">
            </div>

            <button class="btn-submit" onclick="addRecord()">儲存紀錄</button>
        </div>

        <!-- 財務總覽卡片 -->
        <div class="card">
            <h3 class="card-title">📊 財務總覽</h3>
            <div class="summary-list">
                <div class="summary-row">
                    <span>當月收入</span>
                    <span id="dashMonthIncome" class="amt-income">$0</span>
                </div>
                <div class="summary-row">
                    <span>當月支出</span>
                    <span id="dashMonthExpense" class="amt-expense">$0</span>
                </div>
                <div class="summary-row">
                    <span>當月結餘</span>
                    <span id="dashMonthBalance" class="amt-income">$0</span>
                </div>
                <hr class="divider-dashed">
                <div class="summary-row">
                    <span>當年收入</span>
                    <span id="dashYearIncome" class="amt-income">$0</span>
                </div>
                <div class="summary-row">
                    <span>當年支出</span>
                    <span id="dashYearExpense" class="amt-expense">$0</span>
                </div>
                <div class="summary-row bold">
                    <span>當年結餘</span>
                    <span id="dashYearBalance" class="amt-income">$0</span>
                </div>
            </div>
        </div>

        <!-- 當月圖表區域 -->
        <div class="card">
            <h3 id="mTitle" class="card-title-center">🗓️ 當月支出比例</h3>
            <div class="chart-container">
                <div id="monthChartWrapper" class="donut-wrapper"></div>
                <div id="monthLegend" class="legend-box-bottom"></div>
            </div>
        </div>

        <!-- 當年圖表區域 -->
        <div class="card">
            <h3 id="yTitle" class="card-title-center">🌟 當年支出比例</h3>
            <div class="chart-container">
                <div id="yearChartWrapper" class="donut-wrapper"></div>
                <div id="yearLegend" class="legend-box-bottom"></div>
            </div>
        </div>

        <!-- 歷史明細區域 -->
        <div class="card">
            <div class="history-header">
                <h3 id="listTitle">歷史明細</h3>
                <button id="toggleCollapseBtn" class="btn-toggle" onclick="toggleHistoryCollapse()">收斂 ▲</button>
            </div>

            <div class="range-filters">
                <button id="btnRangeMonth" class="btn-range active" onclick="setHistoryRange('month')">當月</button>
                <button id="btnRangeYear" class="btn-range" onclick="setHistoryRange('year')">當年</button>
                <button id="btnRangeAll" class="btn-range" onclick="setHistoryRange('all')">全部</button>
            </div>

            <div id="badgeBox"></div>
            <div id="recordList"></div>
        </div>
    </div>

    <!-- 分類選擇 Modal Pop-up -->
    <div id="cateModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>選擇分類</h3>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="cate-column">
                    <div class="cate-title">主分類</div>
                    <ul id="mainCateList" class="cate-list"></ul>
                </div>
                <div class="cate-column">
                    <div class="sub-cate-wrapper">
                        <div class="cate-title">子分類</div>
                        <ul id="subCateList" class="cate-list"></ul>
                        <button class="btn-add-custom" onclick="addCustomSubCate()">
                            <span class="plus-icon">+</span> 新增分類
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
