<!DOCTYPE html>
<!-- 💡 關鍵修復：強制加上 translate="no" 與 notranslate 類別，防範瀏覽器自動翻譯導致程式碼當機 -->
<html lang="zh-TW" translate="no" class="notranslate">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全單機記帳本</title>
    <link rel="manifest" href="manifest.json">
    <!-- 💡 載入現代圖表庫 -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --primary-color: #0071e3;
            --bg-color: #f5f5f7;
            --card-color: #ffffff;
            --text-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 450px; background: var(--card-color); border-radius: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.05); padding: 20px; min-height: 90vh; display: flex; flex-direction: column; }
        h2 { text-align: center; margin-bottom: 20px; font-size: 20px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 14px; color: #666; margin-bottom: 6px; }
        input { width: 100%; padding: 12px; border: 1px solid #e5e5e5; border-radius: 12px; font-size: 16px; background: #fafafa; outline: none; }
        select { width: 100%; padding: 12px; border: 1px solid #e5e5e5; border-radius: 12px; font-size: 16px; background: #fff; }
        button { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; background-color: var(--primary-color); color: white; margin-top: 10px; }
        .charts-container { display: flex; flex-direction: column; gap: 20px; margin: 20px 0; padding: 15px; background: #fdfdfd; border-radius: 20px; border: 1px solid #eee; }
        .chart-box { background: #fff; border-radius: 16px; padding: 15px; text-align: center; }
        .chart-title { font-size: 14px; font-weight: 600; color: #555; margin-bottom: 10px; }
        .chart-wrapper { position: relative; width: 100%; max-width: 180px; margin: 0 auto; }
        .history-section { margin-top: 15px; flex: 1; }
        .history-title { font-size: 16px; font-weight: 600; color: #444; margin-bottom: 12px; }
        .filter-badge { background-color: #e3f2fd; color: #0071e3; font-size: 12px; padding: 4px 10px; border-radius: 20px; cursor: pointer; display: inline-block; margin-bottom: 10px; }
        .record-item { background: #f9f9f9; padding: 12px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #0071e3; }
        .btn-delete { background: none; color: #ff3b30; font-size: 14px; cursor: pointer; padding: 4px; width: auto; margin: 0; }
    </style>
</head>
<body>
<div class="app-container">
    <h2>安全單機記帳本</h2>
    <div class="form-group"><label>選擇日期</label><input type="date" id="dateInput"></div>
    <div class="form-group"><label>輸入金額</label><input type="number" id="amountInput" placeholder="$ 0" inputmode="numeric"></div>
    <div class="form-group">
        <label>選擇大項分類</label>
        <select id="mainCateInput">
            <option value="飲食">飲食 🍔</option>
            <option value="交通">交通 🚗</option>
            <option value="娛樂">娛樂 🎬</option>
            <option value="購物">購物 🛍️</option>
            <option value="住家">住家 🏠</option>
        </select>
    </div>
    <div class="form-group"><label>備註說明 (可自行填寫自訂細項名目)</label><input type="text" id="noteInput" placeholder="例如：戒指、午餐麥當勞"></div>
    <button onclick="addRecord()">儲存紀錄</button>
    <div class="charts-container">
        <div class="chart-box"><div class="chart-title" id="mTitle">🗓️ 當月消費比例 (點擊區塊可篩選)</div><div class="chart-wrapper"><canvas id="monthChart"></canvas></div></div>
        <div class="chart-box"><div class="chart-title" id="yTitle">🌟 當年消費比例 (點擊區塊可篩選)</div><div class="chart-wrapper"><canvas id="yearChart"></canvas></div></div>
    </div>
    <div class="history-section">
        <div class="history-title" id="listTitle">歷史明細</div>
        <div id="badgeBox"></div>
        <div id="recordList"></div>
    </div>
</div>
<script>
    // 🎨 馬卡龍美感色彩設定
    const categoryColors = {
        "飲食": "#ffb3ba",
        "交通": "#baffc9",
        "娛樂": "#e8c4ff",
        "購物": "#fdd7e4",
        "住家": "#ffdfba"
    };

    let records = JSON.parse(localStorage.getItem('money_records')) || [];
    let currentFilterType = null;
    let currentFilterCategory = null;
    let monthChartInstance = null;
    let yearChartInstance = null;

    window.onload = function() {
        // 預設日期初始化（橫線格式，與瀏覽器原生 Date 物件高度相容）
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        document.getElementById('dateInput').value = yyyy + '-' + mm + '-' + dd;
        
        renderRecords();

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log('SW註冊失敗', err));
        }
    };

    // ➕ 新增記帳紀錄
    function addRecord() {
        const dateVal = document.getElementById('dateInput').value;
        const amount = parseFloat(document.getElementById('amountInput').value);
        const mainCate = document.getElementById('mainCateInput').value;
        const note = document.getElementById('noteInput').value.trim();

        if (!dateVal) return alert('請選擇日期！');
        if (!amount || amount <= 0) return alert('請輸入正確的金額！');

        const newRecord = {
            id: Date.now(),
            date: dateVal,
            mainCate: mainCate,
            amount: amount,
            note: note
        };

        records.unshift(newRecord);
        saveAndRender();

        document.getElementById('amountInput').value = '';
        document.getElementById('noteInput').value = '';
    }

    // ❌ 刪除記帳紀錄
    function deleteRecord(id) {
        if (confirm('確定要刪除這筆記帳紀錄嗎？')) {
            records = records.filter(record => record.id !== id);
            saveAndRender();
        }
    }

    function saveAndRender() {
        localStorage.setItem('money_records', JSON.stringify(records));
        renderRecords();
    }

    // 🧮 採用高相容原生 Date 物件進行圓環圖動態分析
    function updateCharts() {
        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();

        const monthSums = { "飲食": 0, "交通": 0, "娛樂": 0, "購物": 0, "住家": 0 };
        const yearSums = { "飲食": 0, "交通": 0, "娛樂": 0, "購物": 0, "住家": 0 };

        let hasMonth = false;
        let hasYear = false;

        records.forEach(r => {
            if (!r.date) return;
            
            // 💡 安全修復：將儲存的日期字串統一轉為標準格式，完美相容斜線與橫線
            const recordDate = new Date(r.date.replace(/\//g, '-')); 
            if (isNaN(recordDate.getTime())) return; 

            const rYear = recordDate.getFullYear();
            const rMonth = recordDate.getMonth();

            if (rYear === currentYear) {
                if (yearSums[r.mainCate] !== undefined) {
                    yearSums[r.mainCate] += r.amount;
                    hasYear = true;
                }
                if (rMonth === currentMonth) {
                    if (monthSums[r.mainCate] !== undefined) {
                        monthSums[r.mainCate] += r.amount;
                        hasMonth = true;
                    }
                }
            }
        });

        const labels = Object.keys(categoryColors);
        const colors = Object.values(categoryColors);
        const mData = labels.map(c => monthSums[c]);
        const yData = labels.map(c => yearSums[c]);

        // 🗓️ 繪製當月圓環
        document.getElementById('mTitle').innerText = '🗓️ 當月消費比例' + (hasMonth ? '' : ' (暫無資料)');
        if (monthChartInstance) monthChartInstance.destroy();
        if (hasMonth) {
            const ctxM = document.getElementById('monthChart').getContext('2d');
            monthChartInstance = new Chart(ctxM, {
                type: 'doughnut',
                data: { labels: labels, datasets: [{ data: mData, backgroundColor: colors, borderWidth: 2 }] },
                options: {
                    plugins: { legend: { display: false } },
                    cutout: '65%',
                    // 💡 官方標準點擊事件，配合外層防翻譯，絕不當機！
                    onClick: (e, elements) => {
                        if (elements && elements.length > 0) {
                            const activeIndex = elements[0].index;
                            filterByChart('month', labels[activeIndex]);
                        }
                    }
                }
            });
        }

        // 🌟 繪製當年圓環
        document.getElementById('yTitle').innerText = '🌟 當年消費比例' + (hasYear ? '' : ' (暫無資料)');
        if (yearChartInstance) yearChartInstance.destroy();
        if (hasYear) {
            const ctxY = document.getElementById('yearChart').getContext('2d');
            yearChartInstance = new Chart(ctxY, {
                type: 'doughnut',
                data: { labels: labels, datasets: [{ data: yData, backgroundColor: colors, borderWidth: 2 }] },
                options: {
                    plugins: { legend: { display: false } },
                    cutout: '65%',
                    onClick: (e, elements) => {
                        if (elements && elements.length > 0) {
                            const activeIndex = elements[0].index;
                            filterByChart('year', labels[activeIndex]);
                        }
                    }
                }
            });
        }
    }

    // 🔍 圓環點擊過濾明細
    function filterByChart(type, category) {
        currentFilterType = type;
        currentFilterCategory = category;
        renderRecords();
    }

    function clearFilter() {
        currentFilterType = null;
        currentFilterCategory = null;
        renderRecords();
    }

    // 📋 歷史明細動態生成
    function renderRecords() {
        updateCharts();

        const listDiv = document.getElementById('recordList');
        const badgeDiv = document.getElementById('badgeBox');
        const titleEl = document.getElementById('listTitle');
        
        listDiv.innerHTML = '';
        badgeDiv.innerHTML = '';

        const now = new Date();
        const currentYear = now.getFullYear();
        const currentMonth = now.getMonth();

        let filtered = records;
        if (currentFilterType === 'month') {
            titleEl.innerText = '歷史明細 (當月篩選)';
            badgeDiv.innerHTML = '<span class="filter-badge" onclick="clearFilter()">' + currentFilterCategory + ' ❌ 清除篩選</span>';
            filtered = records.filter(r => {
                const rd = new Date(r.date.replace(/\//g, '-'));
                return !isNaN(rd.getTime()) && rd.getFullYear() === currentYear && rd.getMonth() === currentMonth && r.mainCate === currentFilterCategory;
            });
        } else if (currentFilterType === 'year') {
            titleEl.innerText = '歷史明細 (年度篩選)';
            badgeDiv.innerHTML = '<span class="filter-badge" onclick="clearFilter()">' + currentFilterCategory + ' ❌ 清除篩選</span>';
            filtered = records.filter(r => {
                const rd = new Date(r.date.replace(/\//g, '-'));
                return !isNaN(rd.getTime()) && rd.getFullYear() === currentYear && r.mainCate === currentFilterCategory;
            });
        } else {
            titleEl.innerText = '歷史明細 (全部)';
        }

        if (filtered.length === 0) {
            listDiv.innerHTML = '<div style="text-align:center;color:#999;padding:20px;font-size:14px;">暫無符合的明細</div>';
            return;
        }

        filtered.forEach(r => {
            const item = document.createElement('div');
            item.className = 'record-item';
            item.style.borderLeftColor = categoryColors[r.mainCate] || '#0071e3';
            
            let displayContent = '<strong>' + r.mainCate + '</strong>';
            if (r.note) {
                displayContent += ' (' + r.note + ')';
            }

            item.innerHTML = '<div class="record-info">' +
                '<div class="record-date">' + r.date + '</div>' +
                '<div style="font-size:15px; margin-top:2px;">' + displayContent + '</div>' +
                '</div>' +
                '<div style="display:flex; align-items:center; gap:12px;">' +
                '<span style="font-weight:700; font-size:16px;">$' + r.amount.toLocaleString() + '</span>' +
                '<button class="btn-delete" onclick="deleteRecord(' + r.id + ')">刪除</button>' +
                '</div>';
                
            listDiv.appendChild(item);
        });
    }
</script>
</body>
</html>
